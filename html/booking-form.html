<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>예약 신청 — 머물다</title><link rel="stylesheet" href="../css/common.css"><link rel="stylesheet" href="../css/public.css"><link rel="stylesheet" href="../css/account.css?v=profile6"><script type="module" src="../js/account.js?v=profile6"></script><script type="module" src="../js/booking.js"></script><script type="module" src="../js/visitors.js?v=firebase-stats7"></script></head><body><header class="site-header wrap"><a class="brand" href="../index.html"><span class="brand-mark">m.</span>머물다</a><div id="account-menu" class="account-menu"><a href="../html/my-bookings.html" data-guest-booking>예약</a><a href="../html/signup.html">회원가입</a><a href="../html/login.html">로그인</a><a href="../html/login.html?mode=admin">관리자</a></div></header><main class="account-page"><h1>예약 신청</h1><h2 id="stay-title">숙소 확인 중…</h2><p id="stay-info"></p><p id="guest-info"></p><p class="notice">관리자가 숙소 가능 여부를 확인한 뒤 확정합니다. 실시간 재고 보장과 온라인 결제는 제공하지 않습니다. 예약은 1~30박, 오늘부터 1년 이내 체크인으로 신청합니다.</p><form id="booking-form" class="account-form"><label>체크인<input name="checkIn" type="date" required></label><label>체크아웃<input name="checkOut" type="date" required></label><label>인원<input name="guestCount" type="number" value="1" min="1" step="1" required></label><p id="quote" role="status">날짜와 인원을 입력하세요.</p><label><span><input type="checkbox" required> 관리자 확인 전에는 예약이 확정되지 않음을 확인했습니다.</span></label><button class="primary-button" type="submit" disabled>예약 신청하기</button></form><p id="booking-message" class="account-status" role="status">계정 확인 중…</p><a href="my-bookings.html">내 예약 확인 ↗</a></main><aside id="visitor-stats" class="visitor-stats wrap" aria-label="방문 현황"><div><span>오늘 방문자</span><strong id="visitors-today">—</strong></div><div><span>누적 방문자</span><strong id="visitors-total">—</strong></div><p id="visitor-stats-note" role="status">방문 현황을 불러오는 중…</p></aside></body></html>
